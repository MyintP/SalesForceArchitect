<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salesforce Architect Career Workspace</title>
<meta name="description" content="A zero-to-hero Salesforce Architect curriculum: platform foundations, Apex, LWC, data architecture, sharing design, integration, identity, DevOps, and hands-on Connected Case practice.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <div class="context-bar">
    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation" title="Toggle navigation">&#9776;</button>
    <div class="brand"><b>SF</b>&nbsp;Architect Workspace</div>
    <div class="context-current" id="context-current"></div>
    <div class="context-spacer"></div>
    <button class="icon-btn" id="bookmark-btn" title="Bookmark this sheet">&#9733; Bookmark</button>
    <button class="icon-btn" id="search-btn" title="Search the workspace">&#128269; Search <kbd>Ctrl</kbd>+<kbd>K</kbd></button>
  </div>

  <nav class="sidebar" id="sidebar"></nav>

  <div class="workspace">
    <div class="canvas" id="canvas"></div>

    <div class="study-desk" id="study-desk">
      <div class="desk-head" id="desk-head">
        <span class="desk-title">Study Desk &mdash; notes for this sheet</span>
        <button class="desk-collapse" id="desk-collapse">Collapse &#8595;</button>
      </div>
      <div class="desk-body">
        <textarea id="desk-notes" placeholder="Notes for this sheet — thoughts, questions, things to revisit..."></textarea>
      </div>
    </div>
  </div>

</div>

<div class="search-overlay" id="search-overlay">
  <div class="search-box">
    <input type="text" id="search-input" placeholder="Jump to a sheet by name...">
    <div class="search-results" id="search-results"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
